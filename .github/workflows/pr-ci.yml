name: PR CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  typecheck-build:
    name: typecheck-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: bash .agents/hooks/self-test.sh
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Check Worker deployment bundle (dry run)
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          outdir="$(mktemp -d "$RUNNER_TEMP/wrangler-dry-run.XXXXXX")"
          ./node_modules/.bin/wrangler deploy --dry-run --outdir "$outdir"
      - run: node --test scripts/dependabot-policy.test.mjs
