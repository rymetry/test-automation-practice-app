name: Dependabot automerge

on:
  workflow_run:
    workflows: [PR CI]
    types: [completed]

permissions: {}

concurrency:
  group: dependabot-automerge-main
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.DEPENDABOT_AUTOMERGE == 'true' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      # workflow_run の github.sha はデフォルトブランチのコミット。PRのコードは実行しない。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check and merge
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/merge-dependabot.mjs

  deploy:
    needs: merge
    if: needs.merge.outputs.merged == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch existing Deploy workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main; then
            echo "::error::マージ済みですが自動デプロイを開始できませんでした。Actions の Deploy を main で手動実行してください。"
            exit 1
          fi
