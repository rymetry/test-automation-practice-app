version: 2
updates:
  # SHA 固定した Action の更新 PR を週次で 1 本にまとめる（GITHUB_TOKEN には workflows 権限がないため手動レビュー）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
  # 自動マージ対象の開発依存は 1 PR = 1 直接依存に保ち、固定 peer 依存を持つ React 系のみグループ化して手動レビューする
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # 公開直後に取り下げられる悪性版を自動マージの対象にしない
    cooldown:
      default-days: 3
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
